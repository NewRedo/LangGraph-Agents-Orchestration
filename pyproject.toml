[project]
name = "medical-langgraph-demo"
version = "0.1.0"
description = "A small FastAPI, LangGraph and MCP teaching example"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
    "mcp>=1.26,<2",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
